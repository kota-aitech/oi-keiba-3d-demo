}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.lead{padding:10px 14px;background:var(--paper2);border-bottom:2px solid var(--rule);font-size:12px;color:var(--sub)}
.lead b{color:var(--ink)}
.warn{margin-top:6px;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);color:var(--ink);font-size:11.5px;line-height:1.6}
.wrap{padding:12px 14px 40px;max-width:1100px}
h2{font-family:var(--mincho);font-size:15px;margin:20px 0 8px;border-left:5px solid var(--red);padding-left:9px}
h2:first-child{margin-top:0}
h2 small{font-family:var(--gothic);font-weight:400;font-size:11px;color:var(--sub);margin-left:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;border:1px solid var(--rule2);margin-bottom:6px}
th{background:var(--band);color:#efe7d8;padding:6px 8px;font-size:10.5px;text-align:right;white-space:nowrap;border-right:1px solid #453d34}
th:last-child{border-right:0}
th.l,td.l{text-align:left}
td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule3);white-space:nowrap}
tr:nth-child(even) td{background:#f7f2e6}
.mk{font-family:var(--mincho);font-size:18px;font-weight:700}
.mk.m1{color:var(--red)}.mk.m2{color:var(--blue)}
.roi{font-weight:700}
.pos{color:var(--red)}.neg{color:var(--blue)}
.bar{display:inline-block;width:70px;height:7px;background:var(--rule3);vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--blue)}
.bar i.ok{background:var(--red)}
.bar .line{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55}
.note{color:var(--sub);font-size:11.5px;line-height:1.7;margin:6px 0 0;max-width:74ch}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:640px){ .wrap{padding:10px 10px 40px} table{font-size:11.5px} td,th{padding:5px 5px} .bar{display:none} }
</style>

const $=id=>document.getElementById(id);
const MKC={'◎':'m1','○':'m2','▲':'m3'};
const pc=v=>(v*100).toFixed(1)+'%';
const roiCls=v=>v>=1?'pos':v<0.75?'neg':'';
/* 100% を基準線にしたバー。控除率のぶん 75〜80% が「何も考えず買った場合」 */
const bar=v=>`<span class="bar"><i class="${v>=1?'ok':''}" style="width:${Math.min(100,v/1.4*100)}%"></i><span class="line" style="left:${100/1.4}%"></span></span>`;

function table(d,label){
  return `<table><thead><tr><th class="l">${label}</th><th>頭数</th><th>勝率</th><th>複勝率</th>
    <th>平均人気</th><th>平均単勝</th><th>単勝回収率</th><th>複勝回収率</th></tr></thead><tbody>`
    +(NKMR.marks||[]).map(m=>{
      const e=d[m]; if(!e||!e.n)return '';
      return `<tr><td class="l"><span class="mk ${MKC[m]||''}">${m}</span></td>
        <td>${e.n.toLocaleString()}</td><td>${pc(e.winRate)}</td><td>${pc(e.placeRate)}</td>
        <td>${e.avgPop||'—'}</td><td>${e.avgOdds?e.avgOdds.toFixed(1)+'倍':'—'}</td>
        <td class="roi ${roiCls(e.tanRoi)}">${(e.tanRoi*100).toFixed(0)}%${bar(e.tanRoi)}</td>
        <td class="roi ${roiCls(e.fukuRoi)}">${(e.fukuRoi*100).toFixed(0)}%${bar(e.fukuRoi)}</td></tr>`;
    }).join('')+'</tbody></table>';
}

$('all').innerHTML=table(NKMR.all||{},'印')+

   南関の払戻率はおよそ75〜80%なので、そこが「何も考えずに買った場合」の水準。</p>`;
$('tracks').innerHTML=Object.entries(NKMR.byTrack||{})
