# Render Blueprint: リポジトリ直下に置くと「New > Blueprint」から一発で静的サイトを作れます
# ダッシュボードから手動で Static Site を作る場合はこのファイルは不要です
services:
  - type: web
    name: oi-keiba-3d-demo
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
