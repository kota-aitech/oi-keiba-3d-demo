# Render Blueprint: リポジトリ直下に置くと「New > Blueprint」から一発で静的サイトを作れます
# ダッシュボードから手動で Static Site を作る場合はこのファイルは不要です
#
# 複数ページ（index.html / race.html / data.html / boat.html）と data/ 配下の JSON を
# そのまま配信する構成なので、SPA 用の catch-all rewrite は置かない。
# 置くと /data/nankan/*.json や他の HTML まで index.html に書き換わる可能性がある。
services:
  - type: web
    name: oi-keiba-3d-demo
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      # トップは「おすすめレース」。3Dは /index.html で従来どおり開ける。
      # ここに SPA 用の catch-all（/* → /index.html）は置かないこと。
      # 置くと data/nankan/*.json や他の HTML まで index.html に書き換わる。
      - type: rewrite
        source: /
        destination: /top.html
