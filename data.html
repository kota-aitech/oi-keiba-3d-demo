const A=(i)=>r=>r[i];
function actorTabs(kind,label){
  return {
    label, rows:()=>NKB[kind]||[],
    name:r=>r[0], n:r=>r[2],
    trackIdx:(r,ti)=>r[10]&&r[10][ti],
    cols:[
      {h:'#',cls:'l',cell:(r,i)=>`<td class="l rank">${i+1}</td>`,get:(r,i)=>i,num:true},
      {h:label,cls:'l',cell:r=>`<td class="l"><span class="nm">${r[0]}</span> <span class="sub">${r[1]||''}</span></td>`,get:r=>r[0]},
      {h:'出走',get:A(2),num:true,cell:r=>`<td>${r[2].toLocaleString()}</td>`},
      {h:'1着',get:A(3),num:true,cell:r=>`<td>${r[3].toLocaleString()}</td>`},
      {h:'勝率',get:r=>r[3]/r[2],num:true,cell:r=>`<td>${pc(r[3]/r[2])}</td>`},
      {h:'3着内率',get:r=>r[4]/r[2],num:true,cell:r=>`<td>${pc(r[4]/r[2])}</td>`},
      {h:'指数',get:A(5),num:true,cell:r=>idxCell(r[5]),desc:true},
      {h:'3着内指数',get:A(6),num:true,cell:r=>`<td class="${cls(r[6])}">${fmt(r[6])}</td>`},
      {h:'直近1年',get:A(7),num:true,cell:r=>`<td class="${cls(r[7])}">${fmt(r[7])}</td>`,note:'3年平均との差'},
      {h:'直近3ヶ月',get:A(8),num:true,cell:r=>`<td class="${cls(r[8])}">${fmt(r[8])}</td>`},

    ],
    sort:6,
  };
}

let cur='jockey',sortCol=null,sortDesc=true,limit=200;

$('nav').innerHTML=ORDER.map(k=>`<button data-k="${k}" class="${k===cur?'on':''}">${TABS[k].label}</button>`).join('');
$('trk').innerHTML='<option value="">南関東すべて</option>'+TRACKS.map((t,i)=>`<option value="${i}">${t}</option>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;sortCol=null;limit=200;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render();});
$('q').oninput=()=>{limit=200;render();};
$('minN').onchange=()=>{limit=200;render();};
$('trk').onchange=()=>{limit=200;render();};
$('csv').onclick=()=>{const t=tsv();navigator.clipboard?.writeText(t).then(()=>{$('csv').textContent='コピーしました';setTimeout(()=>$('csv').textContent='表をコピー（TSV）',1400);},()=>alert(t.slice(0,2000)));};

function view(){
  const T=TABS[cur];
  if(T.pane)return null;
  const q=$('q').value.trim().toLowerCase(),minN=+$('minN').value,ti=$('trk').value===''?null:+$('trk').value;
  let rows=T.rows().filter(r=>T.n(r)>=minN);
  if(q)rows=rows.filter(r=>T.name(r).toLowerCase().includes(q));
  if(ti!=null&&T.trackIdx)rows=rows.filter(r=>T.trackIdx(r,ti)!=null);
  const si=sortCol==null?T.sort:sortCol;
  const c=T.cols[si];
  if(c&&c.get){
    const dir=(sortCol==null?(c.desc!==false):sortDesc)?-1:1;
    rows=rows.slice().sort((a,b)=>{const x=c.get(a),y=c.get(b);
      if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
      return (typeof x==='string'?x.localeCompare(y,'ja'):x-y)*dir;});
  }
  return {T,rows,si};
}
function render(){
  const T=TABS[cur];
  document.querySelector('.bar').style.display=T.pane?'none':'';
  if(T.pane){$('wrap').innerHTML=trendPane();$('count').textContent='';return;}
  const v=view();
  const shown=v.rows.slice(0,limit);
  const head=v.T.cols.map((c,i)=>`<th class="${c.cls||''} ${i===v.si?'on':''}" data-i="${i}" title="${c.note||''}">${c.h}${i===v.si?`<span class="ar">${(sortCol==null?(c.desc!==false):sortDesc)?'▼':'▲'}</span>`:''}</th>`).join('');
  const body=shown.map((r,i)=>`<tr>${v.T.cols.map(c=>c.cell(r,i)).join('')}</tr>`).join('');
  $('wrap').innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    +(v.rows.length>shown.length?`<button class="more" id="more">さらに ${Math.min(500,v.rows.length-shown.length)} 件を表示（残り ${v.rows.length-shown.length} 件）</button>`:'');
  $('count').textContent=`${v.rows.length.toLocaleString()} 件中 ${shown.length.toLocaleString()} 件を表示`;
  document.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{
    const i=+th.dataset.i;
    if(i===(sortCol==null?v.si:sortCol))sortDesc=!sortDesc;
    else{sortCol=i;sortDesc=v.T.cols[i].get&&typeof v.T.cols[i].get(v.rows[0]||[],0)==='string'?false:true;}
    render();});
  const m=$('more');if(m)m.onclick=()=>{limit+=500;render();};
}
function tsv(){
  const v=view();if(!v)return '';
  const strip=h=>h.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
  const lines=[v.T.cols.map(c=>c.h).join('\t')];
  v.rows.forEach((r,i)=>lines.push(v.T.cols.map(c=>strip(c.cell(r,i))).join('\t')));
  return lines.join('\n');
}

/* ---- 場・距離の傾向 ---- */
function trendPane(){
  const tr=NKB.trend||{};
  if(!Object.keys(tr).length)return '<div class="pane"><p>傾向データがありません。</p></div>';
  const sc=['#e4572e','#f2b134','#3fa7b8','#8e6cc2'];
  let h='<div class="pane">';
  h+=`<p>3着内になった馬がどこにいたかを、出馬表の前5走欄（約5万走）から距離別に集計したもの。
      <b>枠の有利不利は「3着内シェア ÷ 出走シェア」で見る</b>（1.00 が損得なし）。枠ごとに入る頭数が違うので、3着内シェアだけを比べても意味がない。</p>`;
  for(const [name,t] of Object.entries(tr)){
    h+=`<h2>${name}</h2>`;
    const c=t.calib||{};
    h+=`<div class="kv"><span>前残りの中心 / ばらつき</span><span>${(c.frontMid*100).toFixed(0)}% ± ${(c.frontSd*100).toFixed(1)}pt</span>
      <span>開催日ベースの平年値</span><span>${(c.meetMid*100).toFixed(0)}%（前方集団 ÷ 前方+後方）</span>
      <span>枠の得失の中心 / ばらつき</span><span>${fmt(c.gateMid)} ± ${c.gateSd?.toFixed(2)}</span></div>`;
    h+=`<table><thead><tr><th class="l">距離</th><th>集計走数</th><th>3着内</th><th>前方3着内率</th>
      <th>逃げ</th><th>先行</th><th>差し</th><th>追込</th><th>内</th><th>中</th><th>外</th><th>中外−内</th></tr></thead><tbody>`;
    const add=(lab,y)=>{
      if(!y)return '';
      const gb=y.gateBase||[1/3,1/3,1/3];
      const rr=[0,1,2].map(i=>y.gate[i]/(gb[i]||1/3));
      const gd=(rr[1]+rr[2])/2-rr[0];
      return `<tr><td class="l">${lab}</td><td>${(y.n||0).toLocaleString()}</td><td>${(y.top||0).toLocaleString()}</td>
        <td>${(y.front3*100).toFixed(0)}%</td>`
        +y.style.map((v,i)=>`<td style="color:${sc[i]}">${(v*100).toFixed(0)}%</td>`).join('')
        +rr.map(v=>`<td class="${v>1.03?'pos':v<0.97?'neg':''}">${v.toFixed(2)}</td>`).join('')
        +`<td class="${cls(gd-(c.gateMid||0))}">${fmt(gd)}</td></tr>`;
    };
    h+=add('全体（近1年）',t.fallback&&t.fallback.year);
    for(const d of Object.keys(t.trendRef||{}).sort((a,b)=>a-b))h+=add(d+'m',t.trendRef[d].year);
    h+='</tbody></table>';
    const m=t.meet||{};
    h+=`<h2 style="color:var(--mute);font-size:12px">開催日ごとの実測（${m.name||''}）</h2>`;
    h+=`<table><thead><tr><th class="l">日</th><th>前方の3着内</th><th>後方の3着内</th><th>前方率</th><th class="l">3着内ベスト3枠</th></tr></thead><tbody>`
      +(m.days||[]).map(d=>`<tr><td class="l">${d.d}${d.partial?` <span class="sub">${d.partial}</span>`:''}</td><td>${d.front}</td><td>${d.back}</td>
        <td>${d.front+d.back?((d.front/(d.front+d.back))*100).toFixed(0)+'%':'—'}</td>
        <td class="l">${(d.best||[]).map(b=>`${b[0]}枠 ${b[1]}回`).join('・')}</td></tr>`).join('')+'</tbody></table>';
  }
  h+='</div>';
  return h;
}

/* ---- 見出し ---- */
const w=NKB.window||{},p=NKB.pop||{};
$('sub').textContent=`${w.leading||''}／母集団 ${(p.runs||0).toLocaleString()}走・平均勝率 ${((p.P0||0)*100).toFixed(1)}%`;
$('foot').innerHTML=`指数はすべて「南関東の平均に対する勝率の対数オッズ差」。0＝平均、+0.7 でおよそ勝率2倍。
  標本の少ない主体は母集団（コンビは騎手・調教師から期待される値）へ縮小推定している。
  コンビの当てはめ式：勝率のロジット = ${(p.L0??0).toFixed(2)} ${NKB.fit?`${NKB.fit.c>=0?'+':''}${NKB.fit.c} + ${NKB.fit.wJ}×騎手指数 + ${NKB.fit.wT}×調教師指数`:''}。
  馬主は出馬表 ${w.cards?`${w.cards.cards.toLocaleString()}レース・${w.cards.horses.toLocaleString()}頭・${w.cards.runs.toLocaleString()}走`:''} からの集計で、期間は騎手・調教師と異なる。
  出典 nankankeiba.com（リーディング情報／出馬表／レース傾向）。生成 ${(NKB.builtAt||'').slice(0,16).replace('T',' ')}`;
render();
</script>
