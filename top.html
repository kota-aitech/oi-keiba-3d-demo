<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本日のおすすめ — 南関東競馬・ボートレース</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead .tag{font-size:11px;color:#c8bfae}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.masthead nav a:hover{background:#2e2721}

.lead{padding:10px 14px;background:var(--paper2);border-bottom:2px solid var(--rule);font-size:12px;color:var(--sub)}
.lead b{color:var(--ink)}
.warn{margin-top:6px;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);color:var(--ink);font-size:11.5px;line-height:1.6}

.bar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:4px 12px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .sp{margin-left:auto;color:var(--faint);font-size:11px}

.wrap{padding:12px 14px 40px;max-width:1400px}
h2{font-family:var(--mincho);font-size:15px;margin:18px 0 8px;border-left:5px solid var(--red);padding-left:9px}
h2:first-child{margin-top:0}
h2 small{font-family:var(--gothic);font-weight:400;font-size:11px;color:var(--sub);margin-left:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--rule2);background:#fff;padding:0;overflow:hidden}
.card.gS{border-color:var(--red);border-width:2px}
.card.gA{border-color:#d99a2b}
.card__h{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--paper2);border-bottom:1px solid var(--rule2)}
.grade{display:inline-block;min-width:26px;text-align:center;font-family:var(--mincho);font-weight:700;
  font-size:16px;padding:1px 6px;color:#fff;background:var(--faint)}
.grade.gS{background:var(--red)}.grade.gA{background:#d99a2b}.grade.gB{background:var(--blue)}.grade.gC{background:#8b8578}
.card__h .rno{font-family:var(--mincho);font-size:16px;font-weight:700}
.card__h .tk{font-size:11px;color:var(--sub)}
.card__h .tm{margin-left:auto;font-size:12px;font-weight:700}
.card__cls{padding:4px 9px 0;font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:5px 9px;font-size:11.5px}
.kv span:nth-child(odd){color:var(--faint)}
.meter{display:inline-block;width:60px;height:6px;background:var(--rule3);vertical-align:middle;margin-left:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red)}
.flow{padding:3px 9px 5px;border-top:1px dotted var(--rule3);border-bottom:1px dotted var(--rule3)}
.flow .t{font-size:10px;color:var(--faint);margin-bottom:2px}
.flow .row{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.flow .g{font-size:9.5px;color:var(--faint);margin:0 2px 0 4px}
.flow .g:first-child{margin-left:0}
.flow .n{display:inline-block;min-width:20px;height:18px;line-height:16px;text-align:center;
  border:1px solid var(--rule);font-weight:700;font-size:11px}
.horses{padding:2px 9px 6px;font-size:12px}
.horses .h{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px dotted var(--rule3)}
.horses .h:last-child{border-bottom:0}
.mk{font-family:var(--mincho);font-size:15px;font-weight:700;width:16px;text-align:center}
.mk.m1{color:var(--red)}.mk.m2{color:var(--blue)}
.num{display:inline-block;min-width:19px;padding:0 4px;text-align:center;font-weight:700;font-size:11px;border:1px solid var(--rule)}
.nm{font-family:var(--mincho);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw{margin-left:auto;font-weight:700;color:var(--red);white-space:nowrap}
.od{color:var(--sub);font-size:11px;white-space:nowrap}
.bets{padding:5px 9px 8px;border-top:1px solid var(--rule3);background:#fffdf7}
.bets .t{font-size:10.5px;color:var(--faint);margin-bottom:2px}
.bets .rec{margin-left:6px;color:var(--sub)}
.bets .boxline{font-family:var(--mincho);font-size:15px;font-weight:700;letter-spacing:.04em}
.bets .boxsub{font-size:10.5px;color:var(--sub);margin-bottom:3px}
.bet{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 6px;margin:0 3px 3px 0;font-size:11.5px}
.bet b{font-family:var(--mincho);font-size:12.5px}
.bet i{font-style:normal;color:var(--red);font-weight:700;margin-left:4px}
.bet .o{color:var(--sub);margin-left:3px;font-size:10.5px}
.card__f{padding:4px 9px 7px}
.card__f a{display:inline-block;border:1px solid var(--rule2);padding:2px 10px;font-size:11px;text-decoration:none;color:var(--sub);background:#fff}

table.sum{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;border:1px solid var(--rule2)}
table.sum th{background:var(--band);color:#efe7d8;padding:5px 8px;font-size:10.5px;text-align:right;white-space:nowrap}
table.sum th.l,table.sum td.l{text-align:left}
table.sum td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--rule3);white-space:nowrap}
table.sum tr:nth-child(even) td{background:#f7f2e6}
.pos{color:var(--red)}.neg{color:var(--blue)}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}

/* 競技の切替（競馬／ボート）。選んだ方だけ表示する */
.sports{display:flex;gap:0;border-bottom:2px solid var(--rule);background:var(--paper2)}
.sports button{flex:1;max-width:260px;padding:9px 12px;border:0;border-right:1px solid var(--rule2);background:transparent;
  font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.sports button small{display:block;font-family:var(--gothic);font-weight:400;font-size:10.5px;letter-spacing:0;color:var(--faint)}
.sports button.on{background:var(--band);color:#fdf9f0}
.sports button.on small{color:#c8bfae}
.sport{display:none}
body[data-sport="keiba"] .sport.keiba,body[data-sport="boat"] .sport.boat{display:block}
body[data-sport="boat"] nav.keiba,body[data-sport="keiba"] nav.boat{display:none}
/* ボートのカード */
.bnum{display:inline-block;min-width:20px;padding:0 4px;text-align:center;font-weight:700;font-size:11.5px;border:1px solid var(--rule)}
.lvl{display:inline-block;padding:0 6px;border-radius:2px;font-size:10px;font-weight:700;vertical-align:1px;color:#fff;background:#8b8578}
.lvl.ex{background:var(--green)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.vbox{border:1px solid var(--rule2);background:#fff;padding:7px 9px;font-size:12px}
.vbox .vn{font-family:var(--mincho);font-size:15px;font-weight:700}
.vbox .vs{color:var(--sub);font-size:11px}
.vbox a{color:var(--blue)}
@media (max-width:640px){
  .masthead .tag{display:none}
  .masthead .logo{font-size:17px}
  .cards{grid-template-columns:1fr}
  .wrap{padding:10px 10px 40px}
  .sports button{max-width:none;font-size:14px;padding:8px 6px}
}
</style>
</head>

const $=id=>document.getElementById(id);
const WAKU=[['#fff','#14100c'],['#ffffff','#14100c'],['#1b1b1b','#ffffff'],['#d0202f','#ffffff'],['#2f5fc0','#ffffff'],
            ['#f2d33c','#14100c'],['#2e8b4f','#ffffff'],['#e8802a','#ffffff'],['#ef9bb8','#14100c']];
const MARKC={'◎':'m1','○':'m2','▲':'m3','△':'m4','☆':'m4'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYJA={oi:'大井',kawasaki:'川崎',funabashi:'船橋',urawa:'浦和'};
let mode='rec';

/* 全レースを1本のリストに */
const ALL=[];
for(const [key,t] of Object.entries(NKT.tracks||{})){
  for(const [dk,list] of Object.entries(t.days||{})){
    for(const r of list)ALL.push({...r,key,track:t.track||KEYJA[key],dayKey:dk});
  }
}
const GORD={S:0,A:1,B:2,C:3};
const evOf=r=>(r.ev&&r.ev.umaren)||0;

document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.f;
  document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));
  render();});

const REC=NKT.record||null;
function recRoi(kind){
  if(!REC)return null;
  let cost=0,ret=0,races=0,hits=0;
  for(const s of Object.values(REC)){const e=s.tally&&s.tally[kind];if(!e)continue;cost+=e.cost;ret+=e.ret;races+=e.races;hits+=e.hits;}
  return cost?{roi:ret/cost,races,hitRate:hits/races}:null;
}
function boxBlock(r){
  const b=r.box&&(r.box[4]||r.box[3]);
  if(!b)return '<div class="t">おすすめを出すには出走馬データが足りません</div>';
  const k=r.box[4]?4:3;
  const rec3=recRoi(`box${k}_sanpuku`),rec2=recRoi(`box${k}_umaren`);
  return `<div class="t">本命BOX（上位${k}頭）${rec3?`<span class="rec">直近${rec3.races}Rの実測 三連複 ${(rec3.roi*100).toFixed(0)}%（的中${(rec3.hitRate*100).toFixed(0)}%）・馬連 ${rec2?(rec2.roi*100).toFixed(0)+'%':'—'}</span>`:''}</div>
    <div class="boxline"><b>${b.sel.join('・')}</b></div>
    <div class="boxsub">三連複 ${b.sanpuku.length}点／馬連 ${b.umaren.length}点</div>`;
}
function betChips(list,label){
  if(!list||!list.length)return '';
  return `<div class="t">${label}<span class="rec">実績 0〜52%（ほぼ当たっていません）</span></div>`+list.slice(0,4).map(b=>
    `<span class="bet"><b>${b.c.join('-')}</b><i>×${b.ev.toFixed(2)}</i><span class="o">想定${b.odds}倍</span></span>`).join('');
}
function card(r){
  const g=r.grade||'—';
  const ev=r.ev?`${(r.ev.umaren||0).toFixed(2)}`:'—';
  const ev3=r.ev?`${(r.ev.sanpuku||0).toFixed(2)}`:'—';
  const conf=r.conf!=null?r.conf:0;
  return `<div class="card g${g}">
    <div class="card__h">
      <span class="grade g${g}" title="期待値による段位。S=上位1割、A=上位1/4、B=上位半分">${g}</span>
      <span class="rno">${r.r}R</span><span class="tk">${esc(r.track)} ${esc(r.dayKey.split(' ')[0])}</span>
      <span class="tm">${r.time||''}</span>
    </div>
    <div class="card__cls">${esc(r.cls)}　<span style="color:var(--faint)">${r.dist}m ${r.n}頭${r.pace?'／想定'+({H:'ハイ',M:'平均',S:'スロー'}[r.pace]||r.pace):''}</span></div>
    <div class="kv">
      <span>期待値</span><span>馬連 <b>×${ev}</b>　三連複 <b>×${ev3}</b>${r.nPos?`　<span style="color:var(--faint)">買える組 ${r.nPos.umaren}／${r.nPos.sanpuku}</span>`:''}</span>
      <span>自信度</span><span>${(conf*100).toFixed(0)}<span class="meter"><i style="width:${Math.min(100,conf*260)}%"></i></span>
        <span style="color:var(--faint)">1位 ${r.pTop!=null?(r.pTop*100).toFixed(0)+'%':'—'}</span></span>
      <span>オッズ</span><span>${r.oddsSrc?esc(r.oddsSrc):'<span style="color:var(--faint)">未取得（人気と合成なし）</span>'}</span>
    </div>
    ${(r.flow&&r.flow.length>=4)?`<div class="flow"><div class="t">展開予想（左ほど前・3角の想定位置）</div>
      <div class="row">${(()=>{
        const f=r.flow,nige=f.filter(x=>x[2]<=2.5),rest=f.filter(x=>x[2]>2.5),cut=Math.ceil(rest.length/3);
        const gs=[['逃',nige],['先',rest.slice(0,cut)],['中',rest.slice(cut,cut*2)],['後',rest.slice(cut*2)]].filter(g=>g[1].length);
        return gs.map(([lab,list])=>`<span class="g">${lab}</span>`+list.map(([no,gate])=>{
          const w=WAKU[gate]||WAKU[0];
          return `<span class="n" style="background:${w[0]};color:${w[1]}">${no}</span>`;}).join('')).join('');
      })()}</div></div>`:''}
    <div class="horses">${(r.top||[]).map(h=>{
      const w=WAKU[h.gate]||WAKU[0];
      return `<div class="h"><span class="mk ${MARKC[h.mark]||''}">${h.mark||''}</span>
        <span class="num" style="background:${w[0]};color:${w[1]}">${h.no}</span>
        <span class="nm">${esc(h.name)}</span>
        <span class="od">${h.odds?h.odds+'倍':''}</span>
        <span class="pw">${h.win!=null?(h.win*100).toFixed(0)+'%':''}</span></div>`;}).join('')}</div>
    <div class="bets">${boxBlock(r)}${r.bets?betChips(r.bets.umaren,'参考：期待値1.0超の馬連'):''}</div>
    <div class="card__f"><a href="race.html?track=${r.key}&day=${encodeURIComponent(r.dayKey)}&r=${r.r}">馬柱を見る →</a></div>
  </div>`;
}

function render(){
  let rs=ALL.slice();
  if(mode==='rec'){
    /* 段位が付くのはオッズが来てから。まだのレースも自信度順で必ず出す */
    const graded=rs.filter(r=>r.grade==='S'||r.grade==='A').sort((a,b)=>GORD[a.grade]-GORD[b.grade]||evOf(b)-evOf(a));
    const rest=rs.filter(r=>!r.grade).sort((a,b)=>(b.conf||0)-(a.conf||0)).slice(0,12);
    rs=graded.concat(rest);
  }else if(mode==='time'){
    rs.sort((a,b)=>(a.dayKey+a.time).localeCompare(b.dayKey+b.time)||a.r-b.r);
  }else{
    rs.sort((a,b)=>(GORD[a.grade]??9)-(GORD[b.grade]??9)||evOf(b)-evOf(a));
  }
  const withOdds=ALL.filter(r=>r.oddsSrc).length;
  $('cnt').textContent=`${ALL.length}レース中 ${rs.length}件を表示（オッズ取得済み ${withOdds}）`;
  if(!rs.length){
    $('body').innerHTML='<p style="color:var(--sub)">条件に合うレースがありません。オッズが取れると段位が付きます。</p>';
    return;
  }
  const head=mode==='rec'?'<h2>おすすめレース <small>段位 S・A ＋ オッズ待ちのレースは自信度順</small></h2>'
    :mode==='time'?'<h2>発走順 <small>すべてのレース</small></h2>'
    :'<h2>全レース <small>段位順</small></h2>';
  $('body').innerHTML=head+`<div class="cards">${rs.map(card).join('')}</div>`;
}

/* 日別の成績。実際に予想して、実際の配当で精算した結果 */
(() => {
  const yen = v => (v || 0).toLocaleString() + '円';
  const R = NKT.record || {};
  if (!Object.keys(R).length) { $('daily').innerHTML = '<p style="color:var(--sub)">日別データがありません。</p>'; return; }

    const e = t && t[k];
    if (!e) return '<td>—</td>';
    return `<td class="${e.roi >= 1 ? 'pos' : e.roi < 0.7 ? 'neg' : ''}" title="投資 ${yen(e.cost)}／払戻 ${yen(e.ret)}／${e.hits}的中">
      <b>${(e.roi * 100).toFixed(0)}%</b><div class="sub">的中${(e.hitRate * 100).toFixed(0)}%</div></td>`;
  };
  let h = '';
  for (const [name, S] of Object.entries(R)) {
    const days = Object.entries(S.byDay || {});
    if (!days.length) continue;
    h += `<h2 style="font-size:13px;border-left-color:var(--rule2)">${name}　全${S.races}レース</h2>`;
    h += `<table class="sum"><thead><tr><th class="l">開催日</th><th>R</th><th>◎的中</th><th>上位3頭に勝ち馬</th>
      <th>三連複4頭BOX</th><th>馬連4頭BOX</th><th>三連複3頭BOX</th><th class="l">使ったオッズ</th></tr></thead><tbody>`;
    for (const [dk, D] of days) {
      const src = Object.entries(D.oddsSrc || {}).map(([k, v]) => `${k}${v}`).join('・');
      h += `<tr><td class="l">${dk}</td><td>${D.races}</td>
        <td>${(D.winRate * 100).toFixed(0)}%</td><td>${(D.top3Rate * 100).toFixed(0)}%</td>
        ${cell(D.tally, 'box4_sanpuku')}${cell(D.tally, 'box4_umaren')}${cell(D.tally, 'box3_sanpuku')}
        <td class="l" style="font-size:11px;color:var(--sub)">${src}</td></tr>`;
    }
    const T = S.tally || {};
    h += `<tr style="border-top:2px solid var(--rule)"><td class="l"><b>合計</b></td><td><b>${S.races}</b></td>
      <td><b>${(S.winRate * 100).toFixed(0)}%</b></td><td><b>${(S.winInTop3 * 100).toFixed(0)}%</b></td>
      ${cell(T, 'box4_sanpuku')}${cell(T, 'box4_umaren')}${cell(T, 'box3_sanpuku')}<td></td></tr>`;
    h += '</tbody></table>';
  }
  h += `<p style="color:var(--sub);font-size:11.5px;margin-top:6px;line-height:1.7">
    予想上位N頭のBOXを1点100円で全レース買った場合。実際の払戻で精算している。
    <b>「使ったオッズ」が「締切前」の日だけが実運用に近い数字</b>で、「最終」の日は
    レース後に確定したオッズを使っているぶん実戦より有利に出ている。
    日別は12レースしかないので、1本の高配当で回収率が100ポイント動く。合計のほうを見てほしい。</p>`;
  $('daily').innerHTML = h;
})();

/* 検証の要約 */
const V=NKT.validation,B=NKT.backtest;
let vh='';
if(V){
  vh+=`<table class="sum"><thead><tr><th class="l">検証 ${V.testRaces}レース（学習 ${V.trainRaces}レース）</th>
    <th>本紙（合成）</th><th>単勝人気</th></tr></thead><tbody>
    <tr><td class="l">1着的中</td><td>${(V.final.top1*100).toFixed(1)}%</td><td>${(V.pub.top1*100).toFixed(1)}%</td></tr>
    <tr><td class="l">上位3頭に勝ち馬</td><td>${(V.final.winnerInTop3*100).toFixed(1)}%</td><td>${(V.pub.winnerInTop3*100).toFixed(1)}%</td></tr>
    <tr><td class="l">logloss（小さいほど良い）</td><td>${V.final.logloss.toFixed(3)}</td><td>${V.pub.logloss.toFixed(3)}</td></tr>
    </tbody></table>`;
}
if(B&&Object.keys(B).length){
  vh+=`<table class="sum" style="margin-top:8px"><thead><tr><th class="l">4頭BOXを全レース買った場合の回収率</th><th>馬連</th><th>三連複</th></tr></thead><tbody>`
    +Object.entries(B).map(([n,d])=>`<tr><td class="l">${n} ${d.races}レース</td>
      <td class="${d.umaren4&&d.umaren4.roi>=1?'pos':'neg'}">${d.umaren4?(d.umaren4.roi*100).toFixed(0)+'%':'—'}</td>
      <td class="${d.sanpuku4&&d.sanpuku4.roi>=1?'pos':'neg'}">${d.sanpuku4?(d.sanpuku4.roi*100).toFixed(0)+'%':'—'}</td></tr>`).join('')
    +'</tbody></table>';
}
$('valid').innerHTML=vh||'<p style="color:var(--sub)">検証データがありません。</p>';

const m=NKT.meta||{};
$('tag').textContent='nankankeiba の出馬表から自動生成';
$('lead').innerHTML=`<b>段位</b>は「単勝オッズから推定した市場価格に対して、本紙の予想確率が何倍あるか（期待値）」で付けている。
  S＝過去データの上位1割、A＝上位1/4、B＝上位半分、C＝それ以下。おすすめ買い目は<b>期待値が1.0を超えた組み合わせだけ</b>を出している。
  <div class="warn"><b>正直に書いておきます。</b>直近230レースの実測では、
  <b>本命BOX</b>が三連複で84〜112%、馬連で75〜78%。一方
  <b>期待値1.0超だけを買うやり方は0〜52%</b>で、ほとんど当たっていません（市場と食い違う組を買う逆張りになるため）。
  そのため<b>おすすめの主役は本命BOX</b>にしています。
  また段位で絞っても回収率が安定して100%を超える証拠は得られていません。
  <b>買う・見送るを機械的に決める根拠には足りません。</b>金額の強弱をつける参考程度に見てください。
  <a href="marks.html" style="color:var(--red)">印別の単勝・複勝回収率はこちら →</a></div>`;
$('foot').innerHTML=`予想は条件付きロジット（Plackett–Luce）で、単勝オッズが取れているレースは人気と合成している。
  オッズは締切8分前に自動取得（tools/watch_odds.mjs）。期待値は単勝オッズから Harville で組み合わせ価格を推定し、
  控除率25%を引いたうえでモデル確率と比べたもの。買い目は「モデル確率が一定以上・想定配当が現実的な範囲」に絞ってある。
  出典 nankankeiba.com。生成 ${(NKT.builtAt||'').slice(0,16).replace('T',' ')}`;
render();

/* ===== ボートレース面 ===== */
const BCOL=['','#ffffff','#222222','#e03a3a','#3b6cf0','#f4d23a','#3aa657'];
const bnum=l=>`<span class="bnum" style="background:${BCOL[l]};color:${l===1||l===5?'#111':'#fff'}">${l}</span>`;
const fmtD=ymd=>`${+ymd.slice(4,6)}/${+ymd.slice(6,8)}`;
const hm=s=>{if(!s)return 9999;const [h,m]=s.split(':').map(Number);return h*60+m;};
let bmode='rec';
const BALL=[];
for(const d of (NKBT2.days||[]))for(const v of d.venues)for(const r of v.races)BALL.push({...r,date:d.date,jcd:v.jcd,venue:v.name,vtitle:v.title,vday:v.day});
document.querySelectorAll('#bbar button').forEach(b=>b.onclick=()=>{bmode=b.dataset.f;document.querySelectorAll('#bbar button').forEach(x=>x.classList.toggle('on',x===b));brender();});
const BT=NKBT2.backtest||null;
const roiOf=k=>BT&&BT.table[k]?BT.table[k]:null;
function bcard(r){
  const t=r.top||[],w=t[0];
  const url=`boat.html?date=${r.date}&jcd=${r.jcd}&r=${r.r}`;
  const s1=roiOf('◎単勝'),s3=roiOf('本命3艇BOX 3連複');
  return `<div class="card ${w&&w.p>=0.6?'gA':''}">
    <div class="card__h"><span class="rno">${r.r}R</span><span class="tk">${esc(r.venue)} ${fmtD(r.date)}</span>
      <span class="lvl ${r.level}">${r.level==='ex'?'直前情報あり':'番組表のみ'}</span><span class="tm">${r.close||''}</span></div>
    <div class="card__cls">${esc(r.cls||'')}　<span style="color:var(--faint)">${esc(r.vtitle||'')}${r.vday?'・'+r.vday:''}</span></div>
    <div class="horses">${t.map((h,i)=>`<div class="h"><span class="mk ${['m1','m2','m3'][i]}">${['◎','○','▲'][i]}</span>${bnum(h.lane)}<span class="nm">${esc(h.name)}</span><span class="od">${h.grade||''}${h.o?'　'+h.o.toFixed(1)+'倍':''}</span><span class="pw">${(h.p*100).toFixed(0)}%</span></div>`).join('')}</div>
    <div class="bets"><div class="t">本命3艇BOX 3連複${s3?`<span class="rec">検証${BT.races.toLocaleString()}Rの実測 的中${s3.hit}%・回収 ${s3.roi}%</span>`:''}</div>
      <div class="boxline"><b>${r.box3}</b></div>
      ${r.tri?`<div class="boxsub">3連単の本線 <b>${r.tri.k}</b>（${(r.tri.p*100).toFixed(1)}%${r.tri.o?`・${r.oddsKind==='snap'?'締切前':'暫定'}オッズ ${r.tri.o}倍・期待値 ${r.tri.ev}`:''}）</div>`:''}
      ${w?`<div class="boxsub">◎単勝${s1?`：検証の実測 的中${s1.hit}%・回収 ${s1.roi}%`:''}</div>`:''}</div>
    <div class="card__f"><a href="${url}">予想と3Dを見る →</a></div></div>`;
}
function brender(){
  if(!BALL.length){$('bbody').innerHTML='<p style="color:var(--sub)">今日・明日の番組表がまだありません。</p>';$('bcnt').textContent='';return;}
  const today=NKBT2.today;const now=new Date();const nowHM=now.getHours()*60+now.getMinutes();
  const notDone=r=>r.date!==today||hm(r.close)>=nowHM-2;
  let h='';
  if(bmode==='venue'){
    for(const d of NKBT2.days){
      h+=`<h2>${fmtD(d.date)} <small>${d.venues.length}場</small></h2><div class="vgrid">`+d.venues.map(v=>{
        const nx=v.races.find(r=>d.date!==today||hm(r.close)>=nowHM-1)||v.races[v.races.length-1];const w=nx.top&&nx.top[0];
        return `<div class="vbox"><div class="vn">${esc(v.name)} <span class="vs">${esc(v.title||'')}${v.day?'・'+v.day:''}</span></div>
          <div class="vs">1コース1着率 ${v.win1!=null?(v.win1*100).toFixed(1)+'%':'—'}・直前情報あり ${v.exCount}R</div>
          <div style="margin-top:4px">次 <b>${nx.r}R</b> ${nx.close||''}　${w?`◎ ${bnum(w.lane)} ${esc(w.name)} ${(w.p*100).toFixed(0)}%`:''}</div>
          <div style="margin-top:3px"><a href="boat.html?date=${d.date}&jcd=${v.jcd}&r=${nx.r}">この場の予想 →</a></div></div>`;}).join('')+'</div>';
    }
    $('bcnt').textContent=`${BALL.length}レース`;$('bbody').innerHTML=h;return;
  }
  let rs=BALL.filter(notDone);
  if(bmode==='rec'){rs.sort((a,b)=>(b.top?.[0]?.p||0)-(a.top?.[0]?.p||0));rs=rs.slice(0,24);h+='<h2>本命の1着率が高いレース <small>これから締切のレース・上位24件（明日ぶんは番組表だけの予測）</small></h2>';}
  else{rs.sort((a,b)=>a.date.localeCompare(b.date)||hm(a.close)-hm(b.close));h+='<h2>締切順 <small>これから締切のレース</small></h2>';}
  $('bcnt').textContent=`${BALL.length}レース中 ${rs.length}件を表示`;
  $('bbody').innerHTML=h+`<div class="cards">${rs.map(bcard).join('')}</div>`;
}
(()=>{
  const m=NKBT2.model,B=NKBT2.backtest;
  const s1=roiOf('◎単勝'),b1=roiOf('［基準］1号艇の単勝'),s3=roiOf('本命3艇BOX 3連複'),b3=roiOf('［基準］123の3連複'),sp=roiOf('◎複勝'),bp=roiOf('［基準］1号艇の複勝');
  $('blead').innerHTML=`全24場の番組表（公式ダウンロードデータ）と直前情報（展示タイム・スタート展示・水面気象）から、
    <b>条件付きロジット</b>で1〜3着の確率を出している。指数は「場×コースの基準勝率からの上振れ」で持ち、
    1号艇に多く乗る選手が強く見える偏りを取り除いてある。${m?`検証 ${m.test?.toLocaleString()}レースで 1着的中 ${(m.hit1*100).toFixed(1)}%・上位3艇に勝ち艇 ${(m.in3*100).toFixed(1)}%（進入コースだけなら ${(m.courseOnly*100).toFixed(1)}%）。`:''}
    <div class="warn"><b>正直に書いておきます。</b>${B?`検証 ${B.races.toLocaleString()}レース（${B.from.slice(0,4)}/${+B.from.slice(4,6)}〜${+B.to.slice(4,6)}/${+B.to.slice(6,8)}）の実測で、
    ◎単勝 ${s1?.roi}%（1号艇を毎回買うと ${b1?.roi}%）、◎複勝 ${sp?.roi}%（同 ${bp?.roi}%）、本命3艇BOX 3連複 ${s3?.roi}%（1-2-3 の3連複 ${b3?.roi}%）。
    <b>どれも基準を上回ってはいるが100%には届いていない。</b>`:''}
    本命の1着率で絞るほど回収率は上がるが、100%を超えるのは予想勝率80%以上の少数のレースだけで標本が足りない。
    買う・見送るを機械的に決める根拠には足りないので、金額の強弱をつける参考程度に。</div>`;
  $('bfoot').innerHTML=`予想は Plackett–Luce（条件付きロジット）。直前情報は発走の約30分前、オッズは締切8分前に自動取得（tools/fetch_live.mjs）。
    期待値は3連単120通りの実オッズ×モデル確率。出典 boatrace.jp・公式ダウンロードデータ（od2）。
    データ時点 ${(NKBT2.builtAt||'').slice(0,16).replace('T',' ')}`;
})();

/* 競技の切替。URL の ?sport= → 前回の選択 → 競馬 */
function setSport(s,save){document.body.dataset.sport=s;document.querySelectorAll('.sports button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.title=(s==='boat'?'ボートレース':'南関東競馬')+' 本日のおすすめ';
  if(save){try{localStorage.setItem('sport',s);}catch(e){}try{history.replaceState(null,'','?sport='+s);}catch(e){}}
  if(s==='boat')brender();}
document.querySelectorAll('.sports button').forEach(b=>b.onclick=()=>setSport(b.dataset.s,true));
(()=>{const q=new URLSearchParams(location.search).get('sport');let s=q;if(!s){try{s=localStorage.getItem('sport');}catch(e){}}setSport(s==='boat'?'boat':'keiba',false);})();
</script>
</body>
</html>
