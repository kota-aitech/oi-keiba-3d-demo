<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南関東競馬 本日のおすすめレース</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead .tag{font-size:11px;color:#c8bfae}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.masthead nav a:hover{background:#2e2721}

.lead{padding:10px 14px;background:var(--paper2);border-bottom:2px solid var(--rule);font-size:12px;color:var(--sub)}
.lead b{color:var(--ink)}
.warn{margin-top:6px;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);color:var(--ink);font-size:11.5px;line-height:1.6}

.bar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:4px 12px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .sp{margin-left:auto;color:var(--faint);font-size:11px}

.wrap{padding:12px 14px 40px;max-width:1400px}
h2{font-family:var(--mincho);font-size:15px;margin:18px 0 8px;border-left:5px solid var(--red);padding-left:9px}
h2:first-child{margin-top:0}
h2 small{font-family:var(--gothic);font-weight:400;font-size:11px;color:var(--sub);margin-left:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--rule2);background:#fff;padding:0;overflow:hidden}
.card.gS{border-color:var(--red);border-width:2px}
.card.gA{border-color:#d99a2b}
.card__h{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--paper2);border-bottom:1px solid var(--rule2)}
.grade{display:inline-block;min-width:26px;text-align:center;font-family:var(--mincho);font-weight:700;
  font-size:16px;padding:1px 6px;color:#fff;background:var(--faint)}
.grade.gS{background:var(--red)}.grade.gA{background:#d99a2b}.grade.gB{background:var(--blue)}.grade.gC{background:#8b8578}
.card__h .rno{font-family:var(--mincho);font-size:16px;font-weight:700}
.card__h .tk{font-size:11px;color:var(--sub)}
.card__h .tm{margin-left:auto;font-size:12px;font-weight:700}
.card__cls{padding:4px 9px 0;font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:5px 9px;font-size:11.5px}
.kv span:nth-child(odd){color:var(--faint)}
.meter{display:inline-block;width:60px;height:6px;background:var(--rule3);vertical-align:middle;margin-left:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red)}
.flow{padding:3px 9px 5px;border-top:1px dotted var(--rule3);border-bottom:1px dotted var(--rule3)}
.flow .t{font-size:10px;color:var(--faint);margin-bottom:2px}
.flow .row{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.flow .g{font-size:9.5px;color:var(--faint);margin:0 2px 0 4px}
.flow .g:first-child{margin-left:0}
.flow .n{display:inline-block;min-width:20px;height:18px;line-height:16px;text-align:center;
  border:1px solid var(--rule);font-weight:700;font-size:11px}
.horses{padding:2px 9px 6px;font-size:12px}
.horses .h{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px dotted var(--rule3)}
.horses .h:last-child{border-bottom:0}
.mk{font-family:var(--mincho);font-size:15px;font-weight:700;width:16px;text-align:center}
.mk.m1{color:var(--red)}.mk.m2{color:var(--blue)}
.num{display:inline-block;min-width:19px;padding:0 4px;text-align:center;font-weight:700;font-size:11px;border:1px solid var(--rule)}
.nm{font-family:var(--mincho);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw{margin-left:auto;font-weight:700;color:var(--red);white-space:nowrap}
.od{color:var(--sub);font-size:11px;white-space:nowrap}
.bets{padding:5px 9px 8px;border-top:1px solid var(--rule3);background:#fffdf7}
.bets .t{font-size:10.5px;color:var(--faint);margin-bottom:2px}
.bets .rec{margin-left:6px;color:var(--sub)}
.bets .boxline{font-family:var(--mincho);font-size:15px;font-weight:700;letter-spacing:.04em}
.bets .boxsub{font-size:10.5px;color:var(--sub);margin-bottom:3px}
.bet{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 6px;margin:0 3px 3px 0;font-size:11.5px}
.bet b{font-family:var(--mincho);font-size:12.5px}
.bet i{font-style:normal;color:var(--red);font-weight:700;margin-left:4px}
.bet .o{color:var(--sub);margin-left:3px;font-size:10.5px}
.card__f{padding:4px 9px 7px}
.card__f a{display:inline-block;border:1px solid var(--rule2);padding:2px 10px;font-size:11px;text-decoration:none;color:var(--sub);background:#fff}

table.sum{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;border:1px solid var(--rule2)}
table.sum th{background:var(--band);color:#efe7d8;padding:5px 8px;font-size:10.5px;text-align:right;white-space:nowrap}
table.sum th.l,table.sum td.l{text-align:left}
table.sum td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--rule3);white-space:nowrap}
table.sum tr:nth-child(even) td{background:#f7f2e6}
.pos{color:var(--red)}.neg{color:var(--blue)}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:640px){
  .masthead .tag{display:none}
  .masthead .logo{font-size:17px}
  .cards{grid-template-columns:1fr}
  .wrap{padding:10px 10px 40px}
}
</style>
</head>

const WAKU=[['#fff','#14100c'],['#ffffff','#14100c'],['#1b1b1b','#ffffff'],['#d0202f','#ffffff'],['#2f5fc0','#ffffff'],

const MARKC={'◎':'m1','○':'m2','▲':'m3','△':'m4','☆':'m4'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 全レースを1本のリストに */
const ALL=[];
for(const [key,t] of Object.entries(NKT.tracks||{})){
  for(const [dk,list] of Object.entries(t.days||{})){
    for(const r of list)ALL.push({...r,key,track:t.track||KEYJA[key],dayKey:dk});
  }
}
const GORD={S:0,A:1,B:2,C:3};
const evOf=r=>(r.ev&&r.ev.umaren)||0;

document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.f;
  document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));
  render();});

const REC=NKT.record||null;
function recRoi(kind){
  if(!REC)return null;
  let cost=0,ret=0,races=0,hits=0;
  for(const s of Object.values(REC)){const e=s.tally&&s.tally[kind];if(!e)continue;cost+=e.cost;ret+=e.ret;races+=e.races;hits+=e.hits;}
  return cost?{roi:ret/cost,races,hitRate:hits/races}:null;
}
function boxBlock(r){
  const b=r.box&&(r.box[4]||r.box[3]);
  if(!b)return '<div class="t">おすすめを出すには出走馬データが足りません</div>';
  const k=r.box[4]?4:3;
  const rec3=recRoi(`box${k}_sanpuku`),rec2=recRoi(`box${k}_umaren`);
  return `<div class="t">本命BOX（上位${k}頭）${rec3?`<span class="rec">直近${rec3.races}Rの実測 三連複 ${(rec3.roi*100).toFixed(0)}%（的中${(rec3.hitRate*100).toFixed(0)}%）・馬連 ${rec2?(rec2.roi*100).toFixed(0)+'%':'—'}</span>`:''}</div>
    <div class="boxline"><b>${b.sel.join('・')}</b></div>
    <div class="boxsub">三連複 ${b.sanpuku.length}点／馬連 ${b.umaren.length}点</div>`;
}
function betChips(list,label){
  if(!list||!list.length)return '';
  return `<div class="t">${label}<span class="rec">実績 0〜52%（ほぼ当たっていません）</span></div>`+list.slice(0,4).map(b=>
    `<span class="bet"><b>${b.c.join('-')}</b><i>×${b.ev.toFixed(2)}</i><span class="o">想定${b.odds}倍</span></span>`).join('');
}
function card(r){
  const g=r.grade||'—';
  const ev=r.ev?`${(r.ev.umaren||0).toFixed(2)}`:'—';
  const ev3=r.ev?`${(r.ev.sanpuku||0).toFixed(2)}`:'—';
  const conf=r.conf!=null?r.conf:0;
  return `<div class="card g${g}">
    <div class="card__h">
      <span class="grade g${g}" title="期待値による段位。S=上位1割、A=上位1/4、B=上位半分">${g}</span>
      <span class="rno">${r.r}R</span><span class="tk">${esc(r.track)} ${esc(r.dayKey.split(' ')[0])}</span>
      <span class="tm">${r.time||''}</span>
    </div>
    <div class="card__cls">${esc(r.cls)}　<span style="color:var(--faint)">${r.dist}m ${r.n}頭${r.pace?'／想定'+({H:'ハイ',M:'平均',S:'スロー'}[r.pace]||r.pace):''}</span></div>
    <div class="kv">
      <span>期待値</span><span>馬連 <b>×${ev}</b>　三連複 <b>×${ev3}</b>${r.nPos?`　<span style="color:var(--faint)">買える組 ${r.nPos.umaren}／${r.nPos.sanpuku}</span>`:''}</span>
      <span>自信度</span><span>${(conf*100).toFixed(0)}<span class="meter"><i style="width:${Math.min(100,conf*260)}%"></i></span>
        <span style="color:var(--faint)">1位 ${r.pTop!=null?(r.pTop*100).toFixed(0)+'%':'—'}</span></span>
      <span>オッズ</span><span>${r.oddsSrc?esc(r.oddsSrc):'<span style="color:var(--faint)">未取得（人気と合成なし）</span>'}</span>
    </div>
    ${(r.flow&&r.flow.length>=4)?`<div class="flow"><div class="t">展開予想（左ほど前・3角の想定位置）</div>
      <div class="row">${(()=>{
        const f=r.flow,nige=f.filter(x=>x[2]<=2.5),rest=f.filter(x=>x[2]>2.5),cut=Math.ceil(rest.length/3);
        const gs=[['逃',nige],['先',rest.slice(0,cut)],['中',rest.slice(cut,cut*2)],['後',rest.slice(cut*2)]].filter(g=>g[1].length);
        return gs.map(([lab,list])=>`<span class="g">${lab}</span>`+list.map(([no,gate])=>{
          const w=WAKU[gate]||WAKU[0];
          return `<span class="n" style="background:${w[0]};color:${w[1]}">${no}</span>`;}).join('')).join('');
      })()}</div></div>`:''}
    <div class="horses">${(r.top||[]).map(h=>{
      const w=WAKU[h.gate]||WAKU[0];
      return `<div class="h"><span class="mk ${MARKC[h.mark]||''}">${h.mark||''}</span>
        <span class="num" style="background:${w[0]};color:${w[1]}">${h.no}</span>
        <span class="nm">${esc(h.name)}</span>
        <span class="od">${h.odds?h.odds+'倍':''}</span>
        <span class="pw">${h.win!=null?(h.win*100).toFixed(0)+'%':''}</span></div>`;}).join('')}</div>
    <div class="bets">${boxBlock(r)}${r.bets?betChips(r.bets.umaren,'参考：期待値1.0超の馬連'):''}</div>
    <div class="card__f"><a href="race.html?track=${r.key}&day=${encodeURIComponent(r.dayKey)}&r=${r.r}">馬柱を見る →</a></div>
  </div>`;
}

function render(){
  let rs=ALL.slice();
  if(mode==='rec'){
    /* 段位が付くのはオッズが来てから。まだのレースも自信度順で必ず出す */
    const graded=rs.filter(r=>r.grade==='S'||r.grade==='A').sort((a,b)=>GORD[a.grade]-GORD[b.grade]||evOf(b)-evOf(a));
    const rest=rs.filter(r=>!r.grade).sort((a,b)=>(b.conf||0)-(a.conf||0)).slice(0,12);
    rs=graded.concat(rest);
  }else if(mode==='time'){
    rs.sort((a,b)=>(a.dayKey+a.time).localeCompare(b.dayKey+b.time)||a.r-b.r);
  }else{
    rs.sort((a,b)=>(GORD[a.grade]??9)-(GORD[b.grade]??9)||evOf(b)-evOf(a));
  }
  const withOdds=ALL.filter(r=>r.oddsSrc).length;
  $('cnt').textContent=`${ALL.length}レース中 ${rs.length}件を表示（オッズ取得済み ${withOdds}）`;
  if(!rs.length){
    $('body').innerHTML='<p style="color:var(--sub)">条件に合うレースがありません。オッズが取れると段位が付きます。</p>';
    return;
  }
  const head=mode==='rec'?'<h2>おすすめレース <small>段位 S・A ＋ オッズ待ちのレースは自信度順</small></h2>'
    :mode==='time'?'<h2>発走順 <small>すべてのレース</small></h2>'
    :'<h2>全レース <small>段位順</small></h2>';
  $('body').innerHTML=head+`<div class="cards">${rs.map(card).join('')}</div>`;
}
